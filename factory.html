<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volta | المصنع</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


    <!-- =========================
         Navbar
    ========================== -->

    <header class="navbar">

        <div class="container navbar-content">

            <a href="index.html" class="logo">

                <span class="logo-mark">
                    V
                </span>

                <span class="logo-text">
                    Volta
                </span>

            </a>


            <div class="nav-actions">

                <!-- Cart -->

                <button class="cart-button" id="cartButton" type="button" aria-label="السلة">

                    <span class="cart-icon">
                        🛒
                    </span>

                    <span
                        class="cart-count"
                        id="cartCount"
                    >
                        0
                    </span>

                </button>


                <!-- Dark Mode -->

                <button class="theme-toggle" id="themeToggle" type="button" aria-label="تغيير الوضع">
                    🌙
                </button>

            </div>

        </div>

    </header>



    <!-- =========================
         Page Header
    ========================== -->

    <main>

        <section class="page-header">

            <div class="container">

                <a href="index.html" class="back-link">

                    <span class="back-icon">
                        →
                    </span>

                    <span>
                        العودة للرئيسية
                    </span>

                </a>


                <div class="page-header-content">

                    <div>

                        <span class="page-label">
                            Volta / Factory
                        </span>

                        <h1>
                            قسم المصنع
                        </h1>

                        <p>
                            حدد منتجات المصنع والكميات المطلوبة.
                        </p>

                    </div>


                    <div class="page-header-icon">
                        🏭
                    </div>

                </div>

            </div>

        </section>



        <!-- =========================
             Products
        ========================== -->

        <section class="products-section">

            <div class="container">


                <!-- Products Top -->

                <div class="products-top">

                    <div>

                        <span class="section-label">
                            المنتجات
                        </span>

                        <h2 id="currentSection">
                            منتجات المصنع
                        </h2>

                    </div>


                    <!-- Search -->

                    <div class="search-box">

                        <span>
                            🔍
                        </span>

                        <input type="search" id="productSearch" placeholder="ابحث عن منتج..." autocomplete="off">

                    </div>

                </div>



                <!-- Products Grid -->

                <div class="products-grid" id="productsGrid">

                    <!-- Products generated by JavaScript -->

                </div>



                <!-- Empty Products -->

                <div class="empty-products" id="emptyProducts" hidden>

                    <span>
                        🔎
                    </span>

                    <h3>
                        المنتج غير موجود
                    </h3>

                    <p>
                        جرّب البحث باسم منتج آخر.
                    </p>

                </div>


            </div>

        </section>




    </main>



    <!-- =========================
         Cart Overlay
    ========================== -->

    <div class="cart-overlay" id="cartOverlay" hidden></div>



    <!-- =========================
         Cart Drawer
    ========================== -->

    <aside class="cart-drawer" id="cartDrawer" aria-label="سلة الطلب">

        <div class="cart-header">

            <div>

                <span class="section-label">
                    Volta
                </span>

                <h2>
                    سلة الطلب
                </h2>

            </div>


            <button class="cart-close" id="cartClose" type="button" aria-label="إغلاق السلة">
                ×
            </button>

        </div>



        <div class="cart-items" id="cartItems">

            <!-- Cart generated by JavaScript -->

        </div>



        <div class="cart-footer">

            <div class="cart-summary">

                <span>
                    عدد المنتجات
                </span>

                <strong id="cartTotalItems">
                    0
                </strong>

            </div>


            <button class="send-order-button" id="sendOrder" type="button">

                <span>
                    إرسال الطلب عبر واتساب
                </span>

                <span>
                    ↗
                </span>

            </button>

        </div>

    </aside>



    <!-- =========================
         Toast
    ========================== -->

    <div class="toast" id="toast" role="status">
        ✓ تمت إضافة المنتج للسلة
    </div>



    <!-- JavaScript -->
    <script src="js/section-auth.js"></script>
    <script src="js/products/factory.js"></script>

    <script src="js/cart.js"></script>

    <script src="js/whatsapp.js"></script>

    <script src="js/factory.js"></script>

    <script src="js/theme.js"></script>

</body>

</html>
