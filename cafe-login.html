<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دخول الكافيه | VOLTA</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-icon">
                ☕
            </div>

            <h1>دخول الكافيه</h1>

            <p>
                أدخل كلمة المرور للدخول إلى قسم الكافيه
            </p>

            <form id="sectionLoginForm">

                <div class="input-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="off" required>

                </div>

                <p id="loginError" class="login-error">
                    كلمة المرور غير صحيحة
                </p>

                <button type="submit" class="login-button">
                    <span>دخول</span>
                    <span>→</span>
                </button>

            </form>

            <a href="index.html" class="back-link">
                ← العودة للرئيسية
            </a>

        </div>

    </main>

    <script>
        const form = document.getElementById("sectionLoginForm");
        const password = document.getElementById("password");
        const error = document.getElementById("loginError");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            if (password.value === "1234") {

                sessionStorage.setItem(
                    "voltaCafeAccess",
                    "true"
                );

                window.location.href = "cafe.html";

            } else {

                error.classList.add("show");

                password.value = "";
                password.focus();

            }

        });

        password.addEventListener("input", function() {
            error.classList.remove("show");
        });
    </script>

</body>

</html>
